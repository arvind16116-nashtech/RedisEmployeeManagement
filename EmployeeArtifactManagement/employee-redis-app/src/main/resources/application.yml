spring:
  application:
    name: employee-redis-app
  datasource:
    url: jdbc:h2:file:./data/employees;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis

server:
  port: 8080

app:
  cache:
    employee-ttl: PT30S